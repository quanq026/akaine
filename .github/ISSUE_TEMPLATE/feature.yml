name: Feature proposal
description: Propose a scoped improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance checks
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Security, licensing or operational constraints
