<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 06: Assemble and prove the Android client</title>
  <desc id="desc">The verified XAPK and public patch source enter separate subassemblies, converge into a rebuilt APK, receive guarded native patches, alignment, and signing, then pass runtime gates.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#526079"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#778195"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#318bd0"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#23936d"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d88612"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7656dc"/></marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#17213a" flood-opacity="0.07"/></filter>
    <style>
text { font-family: "Segoe UI", Inter, Arial, sans-serif; fill: #17213a; }
.chapter { font-size: 14px; font-weight: 700; letter-spacing: 1.8px; fill: #6f788a; }
.title { font-size: 40px; font-weight: 750; letter-spacing: -1.1px; }
.subtitle { font-size: 17px; fill: #59667d; }
.section { font-size: 13px; font-weight: 750; letter-spacing: 1.25px; fill: #5d687d; }
.h2 { font-size: 22px; font-weight: 720; }
.h3 { font-size: 17px; font-weight: 700; }
.body { font-size: 14px; fill: #46536a; }
.small { font-size: 12px; fill: #657086; }
.micro { font-size: 11px; fill: #657086; }
.gate { font-size: 12px; font-weight: 700; fill: #167958; }
.card { fill: #fff; stroke: #d1d8e4; stroke-width: 1.3; filter: url(#shadow); }
.blue { fill: #f2f9ff; stroke: #78bfe8; stroke-width: 1.5; }
.purple { fill: #f7f3ff; stroke: #9b82eb; stroke-width: 1.5; }
.green { fill: #f1fbf7; stroke: #50bd96; stroke-width: 1.5; }
.orange { fill: #fff8ec; stroke: #efb04d; stroke-width: 1.5; }
.gray { fill: #f8f9fb; stroke: #d7dde7; stroke-width: 1.3; }
.red { fill: #fff5f6; stroke: #ef8995; stroke-width: 1.5; }
.line { fill: none; stroke: #526079; stroke-width: 2.2; marker-end: url(#arrow); }
.dash { fill: none; stroke: #778195; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow-gray); }
.blue-line { fill: none; stroke: #318bd0; stroke-width: 2.3; marker-end: url(#arrow-blue); }
.green-line { fill: none; stroke: #23936d; stroke-width: 2.3; marker-end: url(#arrow-green); }
.orange-line { fill: none; stroke: #d88612; stroke-width: 2.3; marker-end: url(#arrow-orange); }
.purple-line { fill: none; stroke: #7656dc; stroke-width: 2.3; marker-end: url(#arrow-purple); }
.rule { stroke: #dde2ea; stroke-width: 1; }
</style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <rect x="48" y="35" width="5" height="79" rx="2.5" fill="#ff596c"/>
  <text x="75" y="58" class="chapter">CHAPTER 06</text>
  <text x="75" y="98" class="title">Assemble and prove the Android client</text>
  <text x="75" y="128" class="subtitle">A version-locked assembly line from one exact arm64 XAPK to one signed APK and a runtime test gauntlet</text>
  <rect x="1228" y="49" width="180" height="28" rx="14" fill="#effbf6" stroke="#50bd96"/>
  <text x="1318.0" y="68" class="small" text-anchor="middle">APK ASSEMBLY LINE</text>
  <rect x="1420" y="49" width="130" height="28" rx="14" fill="#fff8ec" stroke="#efb04d"/>
  <text x="1485.0" y="68" class="small" text-anchor="middle">7.0.255 ONLY</text>
  <text x="64" y="187" class="section">LOCKED INPUTS</text>
  <rect x="55" y="215" width="250" height="145" rx="18" class="blue"/>
  <text x="80" y="254" class="h2">Verified arm64 XAPK</text>
  <text x="80" y="286" class="body">exact size + SHA-256</text>
  <text x="80" y="312" class="body">five APK modules</text>
  <text x="80" y="337" class="gate">Original bytes remain untouched</text>
  <rect x="55" y="420" width="250" height="145" rx="18" class="purple"/>
  <text x="80" y="459" class="h2">Public patch source</text>
  <text x="80" y="491" class="body">managed Smali bridge</text>
  <text x="80" y="517" class="body">AKFC C++ + native plan</text>
  <text x="80" y="542" class="gate">Human-readable and version-guarded</text>
  <rect x="365" y="275" width="220" height="175" rx="22" class="gray"/>
  <text x="475.0" y="318" class="h2" text-anchor="middle">Merge + decode</text>
  <text x="389" y="357" class="body">APKEditor merges splits</text>
  <text x="389" y="384" class="body">Apktool exposes sources</text>
  <text x="389" y="428" class="gate">PASS · baseline hash + members</text>
  <rect x="640" y="220" width="245" height="170" rx="22" class="gray"/>
  <text x="762.5" y="263" class="h2" text-anchor="middle">Managed patch</text>
  <text x="664" y="302" class="body">package + label + providers</text>
  <text x="664" y="329" class="body">AKFC init + cleanup bridge</text>
  <text x="664" y="368" class="gate">PASS · exact replacement counts</text>
  <rect x="640" y="445" width="245" height="170" rx="22" class="gray"/>
  <text x="762.5" y="488" class="h2" text-anchor="middle">AKFC subassembly</text>
  <text x="664" y="527" class="body">RSA-3072 identity</text>
  <text x="664" y="554" class="body">prefixed static crypto loader</text>
  <text x="664" y="593" class="gate">PASS · key identity receipt</text>
  <rect x="940" y="275" width="245" height="175" rx="22" class="orange"/>
  <text x="1062.5" y="318" class="h2" text-anchor="middle">Guarded native patch</text>
  <text x="964" y="357" class="body">routes · Divine · BYD · ETR</text>
  <text x="964" y="384" class="body">FMOD read contract</text>
  <text x="964" y="428" class="gate">PASS · hash + before bytes + receipt</text>
  <rect x="1240" y="275" width="250" height="175" rx="22" class="orange"/>
  <text x="1365.0" y="318" class="h2" text-anchor="middle">Align + sign</text>
  <text x="1264" y="357" class="body">16 KiB page alignment</text>
  <text x="1264" y="384" class="body">stable package signing identity</text>
  <text x="1264" y="428" class="gate">PASS · zipalign + v2/v3 verify</text>
  <path d="M305 287H365" class="blue-line"/>
  <path d="M305 492H480V450" class="purple-line"/>
  <path d="M585 362H640" class="line"/>
  <path d="M585 400H610V530H640" class="purple-line"/>
  <path d="M885 305H940" class="line"/>
  <path d="M885 530H915V408H940" class="purple-line"/>
  <path d="M1185 362H1240" class="orange-line"/>
  <rect x="1238" y="500" width="254" height="112" rx="22" class="green"/>
  <text x="1365" y="540" class="h2" text-anchor="middle">Signed AkaineXD APK</text>
  <text x="1365" y="570" class="body" text-anchor="middle">akai.arc.lmao · 7.0.255</text>
  <text x="1365" y="594" class="gate" text-anchor="middle">hash + signer certificate recorded</text>
  <path d="M1365 450V500" class="green-line"/>
  <text x="64" y="678" class="section">RUNTIME TEST GAUNTLET — ONE SIGNED BUILD</text>
  <line x1="95" y1="742" x2="1495" y2="742" stroke="#d9dee7" stroke-width="7" stroke-linecap="round"/>
  <circle cx="125" cy="742" r="23" fill="#f1fbf7" stroke="#23936d" stroke-width="2"/>
  <path d="M114 742l8 8 15-18" fill="none" stroke="#23936d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="125" y="792" class="h3" text-anchor="middle">Bundle</text>
  <text x="125" y="817" class="small" text-anchor="middle">cold + restart</text>
  <circle cx="365" cy="742" r="23" fill="#f1fbf7" stroke="#23936d" stroke-width="2"/>
  <path d="M354 742l8 8 15-18" fill="none" stroke="#23936d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="365" y="792" class="h3" text-anchor="middle">Login</text>
  <text x="365" y="817" class="small" text-anchor="middle">session persists</text>
  <circle cx="605" cy="742" r="23" fill="#f1fbf7" stroke="#23936d" stroke-width="2"/>
  <path d="M594 742l8 8 15-18" fill="none" stroke="#23936d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="605" y="792" class="h3" text-anchor="middle">Cloud Sync</text>
  <text x="605" y="817" class="small" text-anchor="middle">download succeeds</text>
  <circle cx="845" cy="742" r="23" fill="#f1fbf7" stroke="#23936d" stroke-width="2"/>
  <path d="M834 742l8 8 15-18" fill="none" stroke="#23936d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="845" y="792" class="h3" text-anchor="middle">Official play</text>
  <text x="845" y="817" class="small" text-anchor="middle">preview + chart</text>
  <circle cx="1085" cy="742" r="23" fill="#f1fbf7" stroke="#23936d" stroke-width="2"/>
  <path d="M1074 742l8 8 15-18" fill="none" stroke="#23936d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1085" y="792" class="h3" text-anchor="middle">Special charts</text>
  <text x="1085" y="817" class="small" text-anchor="middle">Divine · BYD · ETR</text>
  <circle cx="1325" cy="742" r="23" fill="#f1fbf7" stroke="#23936d" stroke-width="2"/>
  <path d="M1314 742l8 8 15-18" fill="none" stroke="#23936d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1325" y="792" class="h3" text-anchor="middle">Protected chart</text>
  <text x="1325" y="817" class="small" text-anchor="middle">AKFC + restart</text>
  <path d="M1492 556C1545 620 1518 742 1348 742" class="green-line"/>
  <text x="48" y="875" class="small">A PID or title screen is only a partial observation. Release acceptance requires all six runtime gates on the same artifact.</text>
</svg>
