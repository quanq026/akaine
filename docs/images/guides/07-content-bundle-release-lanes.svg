<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 07: Move one immutable bundle from staging to production</title>
  <desc id="desc">A verified full-root source and controlled overlay produce one immutable candidate. The same candidate passes staging and is promoted unchanged to production, with rollback retaining the previous manifest and configuration.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#526079"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#778195"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#318bd0"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#23936d"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d88612"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7656dc"/></marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#17213a" flood-opacity="0.07"/></filter>
    <style>
text { font-family: "Segoe UI", Inter, Arial, sans-serif; fill: #17213a; }
.chapter { font-size: 14px; font-weight: 700; letter-spacing: 1.8px; fill: #6f788a; }
.title { font-size: 40px; font-weight: 750; letter-spacing: -1.1px; }
.subtitle { font-size: 17px; fill: #59667d; }
.section { font-size: 13px; font-weight: 750; letter-spacing: 1.25px; fill: #5d687d; }
.h2 { font-size: 22px; font-weight: 720; }
.h3 { font-size: 17px; font-weight: 700; }
.body { font-size: 14px; fill: #46536a; }
.small { font-size: 12px; fill: #657086; }
.micro { font-size: 11px; fill: #657086; }
.gate { font-size: 12px; font-weight: 700; fill: #167958; }
.card { fill: #fff; stroke: #d1d8e4; stroke-width: 1.3; filter: url(#shadow); }
.blue { fill: #f2f9ff; stroke: #78bfe8; stroke-width: 1.5; }
.purple { fill: #f7f3ff; stroke: #9b82eb; stroke-width: 1.5; }
.green { fill: #f1fbf7; stroke: #50bd96; stroke-width: 1.5; }
.orange { fill: #fff8ec; stroke: #efb04d; stroke-width: 1.5; }
.gray { fill: #f8f9fb; stroke: #d7dde7; stroke-width: 1.3; }
.red { fill: #fff5f6; stroke: #ef8995; stroke-width: 1.5; }
.line { fill: none; stroke: #526079; stroke-width: 2.2; marker-end: url(#arrow); }
.dash { fill: none; stroke: #778195; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow-gray); }
.blue-line { fill: none; stroke: #318bd0; stroke-width: 2.3; marker-end: url(#arrow-blue); }
.green-line { fill: none; stroke: #23936d; stroke-width: 2.3; marker-end: url(#arrow-green); }
.orange-line { fill: none; stroke: #d88612; stroke-width: 2.3; marker-end: url(#arrow-orange); }
.purple-line { fill: none; stroke: #7656dc; stroke-width: 2.3; marker-end: url(#arrow-purple); }
.rule { stroke: #dde2ea; stroke-width: 1; }
</style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <rect x="48" y="35" width="5" height="79" rx="2.5" fill="#ff596c"/>
  <text x="75" y="58" class="chapter">CHAPTER 07</text>
  <text x="75" y="98" class="title">Move one immutable bundle from staging to production</text>
  <text x="75" y="128" class="subtitle">Two environments, one artifact identity, explicit evidence gates, and a rollback loop</text>
  <rect x="1235" y="49" width="150" height="28" rx="14" fill="#effbf6" stroke="#50bd96"/>
  <text x="1310.0" y="68" class="small" text-anchor="middle">RELEASE LANES</text>
  <rect x="1397" y="49" width="130" height="28" rx="14" fill="#effbf6" stroke="#50bd96"/>
  <text x="1462.0" y="68" class="small" text-anchor="middle">SAME BYTES</text>
  <rect x="55" y="205" width="300" height="220" rx="24" class="gray"/>
  <text x="205" y="246" class="h2" text-anchor="middle">Candidate builder</text>
  <rect x="80" y="278" width="112" height="82" rx="14" class="blue"/>
  <text x="136" y="310" class="h3" text-anchor="middle">Full root</text>
  <text x="136" y="336" class="small" text-anchor="middle">verified</text>
  <rect x="218" y="278" width="112" height="82" rx="14" class="purple"/>
  <text x="274" y="310" class="h3" text-anchor="middle">Overlay</text>
  <text x="274" y="336" class="small" text-anchor="middle">intent only</text>
  <text x="205" y="393" class="gate" text-anchor="middle">new version + never-used alias</text>
  <polygon points="470,240 570,300 570,420 470,480 370,420 370,300" fill="#fff8ec" stroke="#efb04d" stroke-width="2" filter="url(#shadow)"/>
  <text x="470" y="329" class="h3" text-anchor="middle">IMMUTABLE</text>
  <text x="470" y="357" class="h3" text-anchor="middle">CANDIDATE</text>
  <text x="470" y="391" class="small" text-anchor="middle">manifest + parts</text>
  <text x="470" y="413" class="small" text-anchor="middle">build + ready receipts</text>
  <path d="M355 315H370" class="orange-line"/>
  <rect x="635" y="180" width="890" height="275" rx="28" fill="#f7f3ff" stroke="#9b82eb" stroke-width="1.8"/>
  <text x="665" y="217" class="section">STAGING LANE</text>
  <rect x="665" y="255" width="180" height="135" rx="18" class="card"/>
  <text x="755" y="299" class="h3" text-anchor="middle">Upload</text>
  <text x="755" y="329" class="body" text-anchor="middle">manifest + all parts</text>
  <text x="755" y="365" class="gate" text-anchor="middle">PASS</text>
  <rect x="875" y="255" width="180" height="135" rx="18" class="card"/>
  <text x="965" y="299" class="h3" text-anchor="middle">CDN proof</text>
  <text x="965" y="329" class="body" text-anchor="middle">size + full hash</text>
  <text x="965" y="365" class="gate" text-anchor="middle">PASS</text>
  <rect x="1085" y="255" width="180" height="135" rx="18" class="card"/>
  <text x="1175" y="299" class="h3" text-anchor="middle">Activate</text>
  <text x="1175" y="329" class="body" text-anchor="middle">API selects once</text>
  <text x="1175" y="365" class="gate" text-anchor="middle">PASS</text>
  <rect x="1295" y="255" width="180" height="135" rx="18" class="card"/>
  <text x="1385" y="299" class="h3" text-anchor="middle">Cold client</text>
  <text x="1385" y="329" class="body" text-anchor="middle">100% + restart</text>
  <text x="1385" y="365" class="gate" text-anchor="middle">PASS</text>
  <path d="M845 322H875" class="purple-line"/>
  <path d="M1055 322H1085" class="purple-line"/>
  <path d="M1265 322H1295" class="purple-line"/>
  <path d="M570 330H635" class="purple-line"/>
  <path d="M1385 455V545" stroke="#23936d" stroke-width="5" marker-end="url(#arrow-green)"/>
  <rect x="1235" y="472" width="300" height="58" rx="16" class="green"/>
  <text x="1385" y="508" class="gate" text-anchor="middle">PROMOTE EXACT HASHES</text>
  <rect x="635" y="555" width="890" height="225" rx="28" fill="#f1fbf7" stroke="#50bd96" stroke-width="1.8"/>
  <text x="665" y="591" class="section">PRODUCTION LANE</text>
  <rect x="695" y="620" width="220" height="112" rx="18" class="card"/>
  <text x="805" y="661" class="h3" text-anchor="middle">Copy same objects</text>
  <text x="805" y="691" class="body" text-anchor="middle">no rebuild</text>
  <text x="805" y="716" class="gate" text-anchor="middle">PASS</text>
  <rect x="955" y="620" width="220" height="112" rx="18" class="card"/>
  <text x="1065" y="661" class="h3" text-anchor="middle">Install manifest</text>
  <text x="1065" y="691" class="body" text-anchor="middle">preserve old roots</text>
  <text x="1065" y="716" class="gate" text-anchor="middle">PASS</text>
  <rect x="1215" y="620" width="220" height="112" rx="18" class="card"/>
  <text x="1325" y="661" class="h3" text-anchor="middle">Runtime gates</text>
  <text x="1325" y="691" class="body" text-anchor="middle">download + play</text>
  <text x="1325" y="716" class="gate" text-anchor="middle">PASS</text>
  <path d="M915 676H955" class="green-line"/>
  <path d="M1175 676H1215" class="green-line"/>
  <rect x="55" y="550" width="480" height="220" rx="24" class="red"/>
  <text x="295" y="594" class="h2" text-anchor="middle">Rollback kit retained before promotion</text>
  <text x="92" y="635" class="body">Previous manifest and server config</text>
  <text x="92" y="664" class="body">Previous signed APK when client changes</text>
  <text x="92" y="693" class="body">Database backup and service ownership</text>
  <text x="92" y="722" class="body">Restore → restart → public health check</text>
  <text x="92" y="748" class="gate">ROLL BACK BY IDENTITY, NEVER BY RANDOM DELETION</text>
  <path d="M695 734C625 835 390 835 295 770" class="dash"/>
  <text x="48" y="875" class="small">Staging proves both the content and its route. Production receives the exact tested object set, never a fresh rebuild.</text>
</svg>
