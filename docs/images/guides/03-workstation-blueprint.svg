<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 03: Prepare the Windows workstation</title>
  <desc id="desc">Public source, private resources, and generated outputs remain separate around a Windows workstation with a verified Android and Python toolchain.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#526079"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#778195"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#318bd0"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#23936d"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d88612"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7656dc"/></marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#17213a" flood-opacity="0.07"/></filter>
    <style>
text { font-family: "Segoe UI", Inter, Arial, sans-serif; fill: #17213a; }
.chapter { font-size: 14px; font-weight: 700; letter-spacing: 1.8px; fill: #6f788a; }
.title { font-size: 40px; font-weight: 750; letter-spacing: -1.1px; }
.subtitle { font-size: 17px; fill: #59667d; }
.section { font-size: 13px; font-weight: 750; letter-spacing: 1.25px; fill: #5d687d; }
.h2 { font-size: 22px; font-weight: 720; }
.h3 { font-size: 17px; font-weight: 700; }
.body { font-size: 14px; fill: #46536a; }
.small { font-size: 12px; fill: #657086; }
.micro { font-size: 11px; fill: #657086; }
.gate { font-size: 12px; font-weight: 700; fill: #167958; }
.card { fill: #fff; stroke: #d1d8e4; stroke-width: 1.3; filter: url(#shadow); }
.blue { fill: #f2f9ff; stroke: #78bfe8; stroke-width: 1.5; }
.purple { fill: #f7f3ff; stroke: #9b82eb; stroke-width: 1.5; }
.green { fill: #f1fbf7; stroke: #50bd96; stroke-width: 1.5; }
.orange { fill: #fff8ec; stroke: #efb04d; stroke-width: 1.5; }
.gray { fill: #f8f9fb; stroke: #d7dde7; stroke-width: 1.3; }
.red { fill: #fff5f6; stroke: #ef8995; stroke-width: 1.5; }
.line { fill: none; stroke: #526079; stroke-width: 2.2; marker-end: url(#arrow); }
.dash { fill: none; stroke: #778195; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow-gray); }
.blue-line { fill: none; stroke: #318bd0; stroke-width: 2.3; marker-end: url(#arrow-blue); }
.green-line { fill: none; stroke: #23936d; stroke-width: 2.3; marker-end: url(#arrow-green); }
.orange-line { fill: none; stroke: #d88612; stroke-width: 2.3; marker-end: url(#arrow-orange); }
.purple-line { fill: none; stroke: #7656dc; stroke-width: 2.3; marker-end: url(#arrow-purple); }
.rule { stroke: #dde2ea; stroke-width: 1; }
</style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <rect x="48" y="35" width="5" height="79" rx="2.5" fill="#ff596c"/>
  <text x="75" y="58" class="chapter">CHAPTER 03</text>
  <text x="75" y="98" class="title">Prepare the Windows workstation</text>
  <text x="75" y="128" class="subtitle">A workspace blueprint: three storage zones, one verified toolchain, and two readiness gates</text>
  <rect x="1230" y="49" width="190" height="28" rx="14" fill="#effbf6" stroke="#50bd96"/>
  <text x="1325.0" y="68" class="small" text-anchor="middle">WORKSPACE BLUEPRINT</text>
  <rect x="1432" y="49" width="130" height="28" rx="14" fill="#edf8ff" stroke="#78bfe8"/>
  <text x="1497.0" y="68" class="small" text-anchor="middle">NO HARDCODED DRIVE</text>
  <text x="74" y="186" class="section">THREE DURABLE ROOTS</text>
  <rect x="60" y="210" width="330" height="142" rx="18" class="blue"/>
  <text x="86" y="246" class="h3">Public Git repository</text>
  <text x="86" y="275" class="body">Guide · server · patch source</text>
  <text x="86" y="300" class="body">AKAINE_REPO_ROOT</text>
  <text x="86" y="328" class="gate">Versioned and shareable</text>
  <rect x="60" y="385" width="330" height="142" rx="18" class="purple"/>
  <text x="86" y="421" class="h3">Private resource kit</text>
  <text x="86" y="450" class="body">XAPK · assets · Apktool</text>
  <text x="86" y="475" class="body">AKAINE_KIT_ROOT</text>
  <text x="86" y="503" class="gate">Never enters Git</text>
  <rect x="60" y="560" width="330" height="142" rx="18" class="orange"/>
  <text x="86" y="596" class="h3">Generated outputs</text>
  <text x="86" y="625" class="body">Decoded trees · APKs · receipts</text>
  <text x="86" y="650" class="body">Disposable and rebuildable</text>
  <text x="86" y="678" class="gate">Not used as source</text>
  <rect x="510" y="255" width="510" height="390" rx="28" class="gray"/>
  <text x="765" y="307" class="h2" text-anchor="middle">Windows workstation</text>
  <text x="765" y="335" class="body" text-anchor="middle">One PowerShell session carries the chosen paths</text>
  <rect x="686" y="375" width="158" height="105" rx="12" fill="#eef2f8" stroke="#62728f" stroke-width="2"/>
  <path d="M715 504H815M765 480V504" stroke="#62728f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="765" y="535" class="h3" text-anchor="middle">Repository .venv</text>
  <text x="765" y="561" class="small" text-anchor="middle">isolated Python packages</text>
  <path d="M390 281H510" class="blue-line"/>
  <path d="M390 456H475V395H510" class="purple-line"/>
  <path d="M390 631H475V565H510" class="orange-line"/>
  <text x="1128" y="186" class="section">VERIFIED TOOLCHAIN</text>
  <rect x="1090" y="215" width="205" height="108" rx="18" class="blue"/>
  <text x="1112" y="255" class="h3">Git</text>
  <text x="1112" y="284" class="small">source and history</text>
  <rect x="1325" y="215" width="205" height="108" rx="18" class="purple"/>
  <text x="1347" y="255" class="h3">Python</text>
  <text x="1347" y="284" class="small">scripts and server</text>
  <rect x="1090" y="355" width="205" height="108" rx="18" class="orange"/>
  <text x="1112" y="395" class="h3">Java + Apktool</text>
  <text x="1112" y="424" class="small">decode and rebuild</text>
  <rect x="1325" y="355" width="205" height="108" rx="18" class="green"/>
  <text x="1347" y="395" class="h3">Android SDK</text>
  <text x="1347" y="424" class="small">adb · aapt · signing</text>
  <path d="M1020 350H1090" class="dash"/>
  <path d="M1020 405H1090" class="dash"/>
  <path d="M1020 515H1090V409" class="dash"/>
  <path d="M1020 570H1290V409H1325" class="dash"/>
  <rect x="1060" y="525" width="470" height="177" rx="22" class="green"/>
  <text x="1090" y="561" class="h2">Two readiness gates</text>
  <text x="1090" y="596" class="body">doctor.py --ci</text>
  <text x="1090" y="620" class="body">Git · Python · repository</text>
  <text x="1295" y="596" class="body">doctor.py --android</text>
  <text x="1295" y="620" class="body">Java · adb · SDK · Apktool</text>
  <text x="1090" y="676" class="gate">PASS · both commands end with “Requested toolchain is ready.”</text>
  <path d="M1020 600H1060" class="green-line"/>
  <rect x="510" y="730" width="1020" height="88" rx="20" class="green"/>
  <text x="542" y="766" class="h3">Ready for Chapter 04</text>
  <text x="542" y="795" class="body">Clean checkout · private kit path prepared · output path separated · toolchain proven</text>
  <path d="M765 645V730" class="green-line"/>
  <text x="48" y="875" class="small">If a path or tool check fails, fix that boundary before downloading private resources or decoding an APK.</text>
</svg>
