<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="600" viewBox="0 0 1160 600" role="img" aria-labelledby="title desc">
  <title id="title">Assembly và pseudocode của setStateStart trong V36</title>
  <desc id="desc">Ba lệnh ARM64 thực tế nạp con trỏ rồi chuyển đến FMOD mixerResume. Bên phải là phần mã giả Ghidra xuất từ cùng hàm. Đây là hình minh họa kết quả công cụ, không phải screenshot Ghidra hay IDA.</desc>
  <rect width="1160" height="600" rx="16" fill="#f4f7fb"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="40" y="50" font-size="14" font-weight="700" letter-spacing="2" fill="#477196">CÙNG MỘT HÀM · HAI CÁCH ĐỌC</text>
    <text x="40" y="94" font-size="29" font-weight="700" fill="#132c43">setStateStart: chỉ 12 byte, nhưng đọc được luồng gọi</text>
    <text x="40" y="130" font-size="17" fill="#4c6378">Trích từ lib/arm64-v8a/libfmodProvider.so của APK production V36 đã kiểm hash.</text>
    <rect x="40" y="170" width="585" height="245" rx="12" fill="#132c43"/>
    <rect x="649" y="170" width="471" height="245" rx="12" fill="#fff" stroke="#c4d2e0"/>
    <text x="62" y="205" font-size="14" font-weight="700" fill="#9ccbe9">ASSEMBLY · RADARE2 · BASE 0x0</text>
    <text x="671" y="205" font-size="14" font-weight="700" fill="#477196">PSEUDOCODE · GHIDRA</text>
    <g font-family="Consolas,monospace" font-size="16" fill="#edf5fb">
      <text x="62" y="254">0x21b38   adrp x8, 0x58000</text>
      <text x="62" y="294">0x21b3c   ldr x0, [x8, 0x4d8]</text>
      <text x="62" y="334">0x21b40   b   …mixerResume__</text>
    </g>
    <g font-family="Consolas,monospace" font-size="17" fill="#172f45">
      <text x="671" y="254">{</text><text x="671" y="294">  FMOD::System::mixerResume();</text>
      <text x="671" y="334">  return;</text><text x="671" y="374">}</text>
    </g>
    <text x="40" y="462" font-size="18" font-weight="600" fill="#132c43">adrp + ldr</text>
    <text x="200" y="462" font-size="17" fill="#4c6378">Lấy con trỏ từ vùng dữ liệu vào thanh ghi x0.</text>
    <text x="40" y="498" font-size="18" font-weight="600" fill="#132c43">b</text>
    <text x="200" y="498" font-size="17" fill="#4c6378">Chuyển tới hàm FMOD theo dạng tail call.</text>
    <path d="M40 530H1120" stroke="#c4d2e0"/>
    <text x="40" y="567" font-size="16" fill="#4c6378">Hình minh họa từ output thật, không phải ảnh UI. Mã giả có thể thiếu kiểu / tham số; không phải source gốc.</text>
  </g>
</svg>
